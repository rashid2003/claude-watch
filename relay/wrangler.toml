name = "session-watch-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [{ pattern = "relay.sessionwatch.lajward.co", custom_domain = true }]

[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "MacRoom"

# Counters only, never content or ids (src/metrics.ts). Read with GET /v1/metrics and the METRICS_TOKEN secret.
[[durable_objects.bindings]]
name = "METRICS"
class_name = "RelayMetrics"

# Labels the metrics with the deployment (Worker version id).
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MacRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RelayMetrics"]
